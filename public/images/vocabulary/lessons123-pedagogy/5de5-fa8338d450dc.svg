<svg xmlns="http://www.w3.org/2000/svg" width="1618" height="1000" viewBox="0 0 1618 1000"><title>工作日 · gōngzuòrì</title><desc>Una semana laboral habitual, marcada como ejemplo para no afirmar que sábado o domingo nunca puedan ser laborables.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="3.5" markerHeight="3.5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#b34424"/></marker></defs><g font-family="Arial Unicode MS,Arial,sans-serif"><text x="1130" y="174" font-size="80" fill="#173b32" font-weight="600" text-anchor="middle">工作日</text><text x="1130" y="242" font-size="49" fill="#466451" font-weight="400" text-anchor="middle">gōngzuòrì</text><rect x="785" y="355" width="82" height="120" rx="14" fill="#173b32" stroke="#173b32" stroke-width="7"/><text x="826" y="436" font-size="50" fill="#fffdf8" font-weight="600" text-anchor="middle">L</text><rect x="885" y="355" width="82" height="120" rx="14" fill="#173b32" stroke="#173b32" stroke-width="7"/><text x="926" y="436" font-size="50" fill="#fffdf8" font-weight="600" text-anchor="middle">M</text><rect x="985" y="355" width="82" height="120" rx="14" fill="#173b32" stroke="#173b32" stroke-width="7"/><text x="1026" y="436" font-size="50" fill="#fffdf8" font-weight="600" text-anchor="middle">X</text><rect x="1085" y="355" width="82" height="120" rx="14" fill="#173b32" stroke="#173b32" stroke-width="7"/><text x="1126" y="436" font-size="50" fill="#fffdf8" font-weight="600" text-anchor="middle">J</text><rect x="1185" y="355" width="82" height="120" rx="14" fill="#173b32" stroke="#173b32" stroke-width="7"/><text x="1226" y="436" font-size="50" fill="#fffdf8" font-weight="600" text-anchor="middle">V</text><rect x="1285" y="355" width="82" height="120" rx="14" fill="#e6eee5" stroke="#466451" stroke-width="7"/><text x="1326" y="436" font-size="50" fill="#466451" font-weight="600" text-anchor="middle">S</text><rect x="1385" y="355" width="82" height="120" rx="14" fill="#e6eee5" stroke