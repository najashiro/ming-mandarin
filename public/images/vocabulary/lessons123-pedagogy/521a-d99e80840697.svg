<svg xmlns="http://www.w3.org/2000/svg" width="1618" height="1000" viewBox="0 0 1618 1000"><title>刚 · gāng</title><desc>Hecho situado inmediatamente antes del ahora. La proximidad visual distingue recién de un pasado remoto.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="3.5" markerHeight="3.5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#b34424"/></marker></defs><g font-family="Arial Unicode MS,Arial,sans-serif"><text x="1130" y="174" font-size="80" fill="#173b32" font-weight="600" text-anchor="middle">刚</text><text x="1130" y="242" font-size="49" fill="#466451" font-weight="400" text-anchor="middle">gāng</text><path d="M820 460 L1470 460" fill="none" stroke="#466451" stroke-width="12" stroke-linecap="round" marker-end="url(#arrow)"/><circle cx="1280" cy="460" r="37" fill="#b34424" stroke="#b34424" stroke-width="0"/><circle cx="1400" cy="460" r="20" fill="#173b32" stroke="#173b32" stroke-width="0"/><text x="880" y="565" font-size="44" fill="#466451" font-weight="400" text-anchor="middle">antes</text><text x="1260" y="365" font-size="53" fill="#b34424" font-weight="600" text-anchor="middle">recién</text><text x="1400" y="565" font-size="44" fill="#173b32" font-weight="400" text-anchor="middle">ahora</text><path d="M1270 385 L1280 410" fill="none" stroke="#b34424" stroke-width="9" stroke-linecap="round" marker-end="url(#arrow)"/><text x="1130" y="762" font-size="58" fill="#173b32" font-weight="400" text-anchor="middle">我刚认识她。</text><text x="1130" y="822" font-size="44" fill="#466451" font-weight="400" text-anchor="middle">Wǒ gāng rènshi tā.</text></g></svg>
