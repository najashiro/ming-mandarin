<svg xmlns="http://www.w3.org/2000/svg" width="1618" height="1000" viewBox="0 0 1618 1000"><title>还 · hái</title><desc>Suma explícita de café y bocadillo: 还 con el sentido aditivo registrado, no la lectura huán ni un simple gesto ambiguo.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="3.5" markerHeight="3.5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#b34424"/></marker></defs><g font-family="Arial Unicode MS,Arial,sans-serif"><text x="1130" y="174" font-size="80" fill="#173b32" font-weight="600" text-anchor="middle">还</text><text x="1130" y="242" font-size="49" fill="#466451" font-weight="400" text-anchor="middle">hái</text><g transform="translate(900 405) scale(0.8)"><path d="M-65 0 H65 V84 Q62 130 0 130 Q-62 130 -65 84 Z" fill="#f0c8a8" stroke="#173b32" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/><path d="M65 20 C135 8 134 100 65 88" fill="none" stroke="#173b32" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/><path d="M-20 -75 Q-50 -45 -20 -20 M25 -75 Q0 -45 25 -20" fill="none" stroke="#466451" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/></g><text x="1135" y="535" font-size="110" fill="#b34424" font-weight="600" text-anchor="middle">+</text><rect x="1280" y="435" width="165" height="115" rx="22" fill="#f0c8a8" stroke="#173b32" stroke-width="7"/><path d="M1310 465 L1410 465" fill="none" stroke="#b34424" stroke-width="5" stroke-linecap="round"/><path d="M1310 495 L1410 495" fill="none" stroke="#b34424" stroke-width="5" stroke-linecap="round"/><text x="1130" y="732" font-size="55" fill="#173b32" font-weight="400" text-anchor="middle">我要咖啡，还要点心。</text><text x="1130" y="793" font-size="43" fill="#466451" font-weight="400" text-anchor="middle">Wǒ yào kāfēi,</text><text x="1130" y="846" font-size="43" fill="#466451" font-weight="400" text-anchor="middle">hái yào diǎnxin.</text><text x="1130" y="910" font-size="45" fill="#b34424" font-weight="600" text-anchor="middle">y además…</text></g></svg>
