<svg xmlns="http://www.w3.org/2000/svg" width="1618" height="1000" viewBox="0 0 1618 1000"><title>会 · huì</title><desc>Palillos sobre un cuenco y comprobación de capacidad: saber usar palillos, que es el ejemplo registrado.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="3.5" markerHeight="3.5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#b34424"/></marker></defs><g font-family="Arial Unicode MS,Arial,sans-serif"><text x="1130" y="174" font-size="80" fill="#173b32" font-weight="600" text-anchor="middle">会</text><text x="1130" y="242" font-size="49" fill="#466451" font-weight="400" text-anchor="middle">huì</text><circle cx="1050" cy="515" r="105" fill="#fffdf8" stroke="#173b32" stroke-width="8"/><path d="M970 510 Q1050 570 1130 510" fill="#f0c8a8" stroke="#173b32" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/><path d="M1080 440 L1250 285" fill="none" stroke="#173b32" stroke-width="12" stroke-linecap="round"/><path d="M1110 455 L1280 295" fill="none" stroke="#173b32" stroke-width="12" stroke-linecap="round"/><path d="M1290 525 L1335 575 L1440 435" fill="none" stroke="#b34424" stroke-width="25" stroke-linecap="round" stroke-linejoin="round"/><text x="1130" y="762" font-size="58" fill="#173b32" font-weight="400" text-anchor="middle">我会用筷子。</text><text x="1130" y="822" font-size="44" fill="#466451" font-weight="400" text-anchor="middle">wǒ huì yòng kuàizi</text><text x="1130" y="888" font-size="43" fill="#b34424" font-weight="600" text-anchor="middle">habilidad aprendida</text></g></svg>
