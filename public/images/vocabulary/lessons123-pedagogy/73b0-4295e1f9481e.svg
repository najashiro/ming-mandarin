<svg xmlns="http://www.w3.org/2000/svg" width="1618" height="1000" viewBox="0 0 1618 1000"><title>现在 · xiànzài</title><desc>Secuencia relativa de tres momentos. La flecha avanza hacia el futuro y el término estudiado está resaltado.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="3.5" markerHeight="3.5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#b34424"/></marker></defs><g font-family="Arial Unicode MS,Arial,sans-serif"><text x="1130" y="174" font-size="80" fill="#173b32" font-weight="600" text-anchor="middle">现在</text><text x="1130" y="242" font-size="49" fill="#466451" font-weight="400" text-anchor="middle">xiànzài</text><path d="M830 450 L1535 450" fill="none" stroke="#466451" stroke-width="10" stroke-linecap="round" marker-end="url(#arrow)"/><circle cx="850" cy="450" r="42" fill="#e6eee5" stroke="#466451" stroke-width="8"/><text x="850" y="566" font-size="52" fill="#173b32" font-weight="400" text-anchor="middle">antes</text><circle cx="1130" cy="450" r="66" fill="#b34424" stroke="#b34424" stroke-width="8"/><text x="1130" y="566" font-size="52" fill="#b34424" font-weight="700" text-anchor="middle">ahora</text><circle cx="1410" cy="450" r="42" fill="#e6eee5" stroke="#466451" stroke-width="8"/><text x="1410" y="566" font-size="52" fill="#173b32" font-weight="400" text-anchor="middle">después</text><text x="1130" y="725" font-size="48" fill="#466451" font-weight="400" text-anchor="middle">este momento</text></g></svg>
