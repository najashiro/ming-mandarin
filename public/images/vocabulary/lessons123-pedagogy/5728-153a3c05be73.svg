<svg xmlns="http://www.w3.org/2000/svg" width="1618" height="1000" viewBox="0 0 1618 1000"><title>在 · zài</title><desc>Persona presente dentro de un lugar y flecha de localización. 在 se muestra como presencia, según 林娜在。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="3.5" markerHeight="3.5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#b34424"/></marker></defs><g font-family="Arial Unicode MS,Arial,sans-serif"><text x="1130" y="174" font-size="80" fill="#173b32" font-weight="600" text-anchor="middle">在</text><text x="1130" y="242" font-size="49" fill="#466451" font-weight="400" text-anchor="middle">zài</text><path d="M850 420 L1125 250 L1400 420 M905 395 V650 H1345 V395" fill="none" stroke="#466451" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/><g transform="translate(1125 460) scale(0.85)"><circle cx="0" cy="0" r="36" fill="#f0c8a8" stroke="#173b32" stroke-width="7"/><path d="M-52 116 Q-50 50 0 50 Q50 50 52 116" fill="#e6eee5" stroke="#173b32" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/><path d="M-22 117 L-22 167" fill="none" stroke="#173b32" stroke-width="9" stroke-linecap="round"/><path d="M22 117 L22 167" fill="none" stroke="#173b32" stroke-width="9" stroke-linecap="round"/></g><path d="M810 545 L985 545" fill="none" stroke="#b34424" stroke-width="12" stroke-linecap="round" marker-end="url(#arrow)"/><text x="1130" y="762" font-size="58" fill="#173b32" font-weight="400" text-anchor="middle">林娜在。</text><text x="1130" y="822" font-size="44" fill="#466451" font-weight="400" text-anchor="middle">Línnà zài.</text><text x="1130" y="888" font-size="43" fill="#b34424" font-weight="600" text-anchor="middle">está presente</text></g></svg>
