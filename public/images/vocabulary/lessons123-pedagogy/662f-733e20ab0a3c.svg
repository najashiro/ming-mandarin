<svg xmlns="http://www.w3.org/2000/svg" width="1618" height="1000" viewBox="0 0 1618 1000"><title>是 · shì</title><desc>Flecha de identificación entre una persona y la categoría estudiante. Se evita representar 是 como ubicación.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="3.5" markerHeight="3.5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#b34424"/></marker></defs><g font-family="Arial Unicode MS,Arial,sans-serif"><text x="1130" y="174" font-size="80" fill="#173b32" font-weight="600" text-anchor="middle">是</text><text x="1130" y="242" font-size="49" fill="#466451" font-weight="400" text-anchor="middle">shì</text><g transform="translate(900 410) scale(1.1)"><circle cx="0" cy="0" r="36" fill="#f0c8a8" stroke="#173b32" stroke-width="7"/><path d="M-52 116 Q-50 50 0 50 Q50 50 52 116" fill="#e6eee5" stroke="#173b32" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/><path d="M-22 117 L-22 167" fill="none" stroke="#173b32" stroke-width="9" stroke-linecap="round"/><path d="M22 117 L22 167" fill="none" stroke="#173b32" stroke-width="9" stroke-linecap="round"/></g><path d="M1020 470 L1190 470" fill="none" stroke="#b34424" stroke-width="12" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="1250" y="355" width="230" height="230" rx="20" fill="#e6eee5" stroke="#173b32" stroke-width="7"/><path d="M1285 410 L1365 375 L1445 410 L1365 445 Z" fill="#f0c8a8" stroke="#173b32" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/><text x="1365" y="535" font-size="61" fill="#173b32" font-weight="600" text-anchor="middle">学生</text><text x="1130" y="762" font-size="58" fill="#173b32" font-weight="400" text-anchor="middle">他是学生。</text><text x="1130" y="822" font-size="44" fill="#466451" font-weight="400" text-anchor="middle">Tā shì xuésheng.</text><text x="1130" y="888" font-size="43" fill="#b34424" font-weight="600" text-anchor="middle">es estudiante</text></g></svg>
