<svg xmlns="http://www.w3.org/2000/svg" width="1618" height="1000" viewBox="0 0 1618 1000"><title>很 · hěn</title><desc>En 很好吃, el grado alto acompaña una valoración de sabor. No se afirma que 很 siempre tenga énfasis fuerte.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="3.5" markerHeight="3.5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#b34424"/></marker></defs><g font-family="Arial Unicode MS,Arial,sans-serif"><text x="1130" y="174" font-size="80" fill="#173b32" font-weight="600" text-anchor="middle">很</text><text x="1130" y="242" font-size="49" fill="#466451" font-weight="400" text-anchor="middle">hěn</text><circle cx="960" cy="480" r="93" fill="#fffdf8" stroke="#173b32" stroke-width="8"/><circle cx="960" cy="480" r="67" fill="#f0c8a8" stroke="#b34424" stroke-width="6"/><path d="M930 330 Q905 300 930 265 M985 330 Q960 300 985 265" fill="none" stroke="#466451" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><rect x="1190" y="500" width="55" height="80" rx="10" fill="#173b32" stroke="#173b32" stroke-width="7"/><rect x="1270" y="435" width="55" height="145" rx="10" fill="#173b32" stroke="#173b32" stroke-width="7"/><rect x="1350" y="370" width="55" height="210" rx="10" fill="#b34424" stroke="#b34424" stroke-width="7"/><text x="1130" y="762" font-size="58" fill="#173b32" font-weight="400" text-anchor="middle">很好吃。</text><text x="1130" y="822" font-size="44" fill="#466451" font-weight="400" text-anchor="middle">Hěn hǎochī.</text><text x="1130" y="888" font-size="43" fill="#b34424" font-weight="600" text-anchor="middle">muy rico</text></g></svg>
