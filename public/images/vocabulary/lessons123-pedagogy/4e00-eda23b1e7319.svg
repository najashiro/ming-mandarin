<svg xmlns="http://www.w3.org/2000/svg" width="1618" height="1000" viewBox="0 0 1618 1000"><title>一下 · yíxià</title><desc>Burbuja de habla breve y apertura literal del ejemplo 你说一下，你家有几口人？. 一下 suaviza la petición, sin fijar una duración en segundos.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="3.5" markerHeight="3.5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#b34424"/></marker></defs><g font-family="Arial Unicode MS,Arial,sans-serif"><text x="1130" y="174" font-size="80" fill="#173b32" font-weight="600" text-anchor="middle">一下</text><text x="1130" y="242" font-size="49" fill="#466451" font-weight="400" text-anchor="middle">yíxià</text><rect x="860" y="320" width="520" height="245" rx="45" fill="#e6eee5" stroke="#173b32" stroke-width="7"/><path d="M970 565 L955 635 L1065 565" fill="#e6eee5" stroke="#173b32" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/><circle cx="1030" cy="440" r="17" fill="#173b32" stroke="#173b32" stroke-width="0"/><circle cx="1110" cy="440" r="17" fill="#173b32" stroke="#173b32" stroke-width="0"/><circle cx="1190" cy="440" r="17" fill="#173b32" stroke="#173b32" stroke-width="0"/><text x="1130" y="680" font-size="49" fill="#b34424" font-weight="600" text-anchor="middle">petición breve</text><text x="1130" y="762" font-size="58" fill="#173b32" font-weight="400" text-anchor="middle">你说一下</text><text x="1130" y="822" font-size="44" fill="#466451" font-weight="400" text-anchor="middle">Nǐ shuō yíxià</text><text x="1130" y="888" font-size="43" fill="#b34424" font-weight="600" text-anchor="middle">cuéntame un momento</text></g></svg>
