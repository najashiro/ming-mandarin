<svg xmlns="http://www.w3.org/2000/svg" width="1618" height="1000" viewBox="0 0 1618 1000"><title>明年 · míngnián</title><desc>Línea de tiempo relativa: el año actual es 0, desplazamientos enteros de años. El punto y nombre resaltados identifican el término.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="3.5" markerHeight="3.5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#b34424"/></marker></defs><g font-family="Arial Unicode MS,Arial,sans-serif"><text x="1130" y="174" font-size="80" fill="#173b32" font-weight="600" text-anchor="middle">明年</text><text x="1130" y="242" font-size="49" fill="#466451" font-weight="400" text-anchor="middle">míngnián</text><path d="M780 440 L1535 440" fill="none" stroke="#466451" stroke-width="10" stroke-linecap="round" marker-end="url(#arrow)"/><circle cx="790" cy="440" r="32" fill="#e6eee5" stroke="#466451" stroke-width="6"/><text x="790" y="458" font-size="36" fill="#173b32" font-weight="600" text-anchor="middle">−2</text><text x="790" y="565" font-size="47" fill="#466451" font-weight="400" text-anchor="middle">前年</text><circle cx="955" cy="440" r="32" fill="#e6eee5" stroke="#466451" stroke-width="6"/><text x="955" y="458" font-size="36" fill="#173b32" font-weight="600" text-anchor="middle">−1</text><text x="955" y="565" font-size="47" fill="#466451" font-weight="400" text-anchor="middle">去年</text><circle cx="1120" cy="440" r="32" fill="#e6eee5" stroke="#466451" stroke-width="6"/><text x="1120" y="458" font-size="36" fill="#173b32" font-weight="600" text-anchor="middle">0</text><text x="1120" y="565" font-size="47" fill="#466451" font-weight="400" text-anchor="middle">今年</text><circle cx="1285" cy="440" r="53" fill="#b34424" stroke="#b34424" stroke-width="6"/><text x="1285" y="458" font-size="49" fill="#fffdf8" font-weight="600" text-anchor="middle">+1</text><text x="1285" y="565" font-size="47" fill="#b34424" font-weight="700" text-anchor="middle">明年</text><circle cx="1450" cy="440" 