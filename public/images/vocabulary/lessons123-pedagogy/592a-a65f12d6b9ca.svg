<svg xmlns="http://www.w3.org/2000/svg" width="1618" height="1000" viewBox="0 0 1618 1000"><title>太 · tài</title><desc>Contrasta el grado alto 太 con la negación 不太 del ejemplo existente, sin atribuir una frase nueva al corpus.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="3.5" markerHeight="3.5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#b34424"/></marker></defs><g font-family="Arial Unicode MS,Arial,sans-serif"><text x="1130" y="174" font-size="80" fill="#173b32" font-weight="600" text-anchor="middle">太</text><text x="1130" y="242" font-size="49" fill="#466451" font-weight="400" text-anchor="middle">tài</text><path d="M825 460 L1440 460" fill="none" stroke="#466451" stroke-width="13" stroke-linecap="round" marker-end="url(#arrow)"/><circle cx="970" cy="460" r="40" fill="#173b32" stroke="#173b32" stroke-width="0"/><circle cx="1360" cy="460" r="60" fill="#b34424" stroke="#b34424" stroke-width="0"/><text x="970" y="565" font-size="57" fill="#173b32" font-weight="600" text-anchor="middle">不太</text><text x="1360" y="565" font-size="65" fill="#b34424" font-weight="700" text-anchor="middle">太</text><text x="1360" y="650" font-size="43" fill="#b34424" font-weight="400" text-anchor="middle">grado alto</text><text x="1130" y="762" font-size="58" fill="#173b32" font-weight="400" text-anchor="middle">我不太累。</text><text x="1130" y="822" font-size="44" fill="#466451" font-weight="400" text-anchor="middle">Wǒ bú tài lèi.</text><text x="1130" y="888" font-size="43" fill="#b34424" font-weight="600" text-anchor="middle">no tan cansado</text></g></svg>
