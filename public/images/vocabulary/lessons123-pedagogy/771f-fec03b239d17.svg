<svg xmlns="http://www.w3.org/2000/svg" width="1618" height="1000" viewBox="0 0 1618 1000"><title>真 · zhēn</title><desc>Énfasis afirmativo sobre 好: 真好, verdaderamente bien. No se confunde con solo una sonrisa o una marca de verdadero/falso.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="3.5" markerHeight="3.5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#b34424"/></marker></defs><g font-family="Arial Unicode MS,Arial,sans-serif"><text x="1130" y="174" font-size="80" fill="#173b32" font-weight="600" text-anchor="middle">真</text><text x="1130" y="242" font-size="49" fill="#466451" font-weight="400" text-anchor="middle">zhēn</text><rect x="925" y="330" width="410" height="260" rx="45" fill="#e6eee5" stroke="#173b32" stroke-width="7"/><text x="1130" y="512" font-size="105" fill="#173b32" font-weight="600" text-anchor="middle">好！</text><path d="M855 345 L900 375" fill="none" stroke="#b34424" stroke-width="13" stroke-linecap="round"/><path d="M860 490 L900 490" fill="none" stroke="#b34424" stroke-width="13" stroke-linecap="round"/><path d="M1360 375 L1410 345" fill="none" stroke="#b34424" stroke-width="13" stroke-linecap="round"/><path d="M1360 490 L1410 490" fill="none" stroke="#b34424" stroke-width="13" stroke-linecap="round"/><text x="1130" y="762" font-size="58" fill="#173b32" font-weight="400" text-anchor="middle">真好</text><text x="1130" y="822" font-size="44" fill="#466451" font-weight="400" text-anchor="middle">Zhēn hǎo</text><text x="1130" y="888" font-size="43" fill="#b34424" font-weight="600" text-anchor="middle">¡de verdad!</text></g></svg>
