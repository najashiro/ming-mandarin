<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Míng · Reto Mixto móvil</title><style>:root{--paper:#f6f3eb;--ink:#17231f;--muted:#65716c;--jade:#1d6a59;--jade-dark:#124a3f;--line:rgba(24,51,43,.13);--good:#e8f3ec;--bad:#f8e9e7;--hanzi:"Songti SC","STSong","PingFang SC",SimSun,serif}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 83% 0%,rgba(205,222,210,.65),transparent 28rem),var(--paper);color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}.app{max-width:760px;margin:auto;padding:22px 16px max(28px,env(safe-area-inset-bottom))}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}.brand{display:flex;align-items:center;gap:12px}.logo{width:48px;height:48px;border-radius:13px 13px 13px 4px;background:var(--jade);color:#fff;display:grid;place-items:center;font:700 27px/1 var(--hanzi)}h1{font-size:21px;margin:0}.sub{color:var(--muted);font-size:12px}.panel{background:rgba(255,255,255,.72);border:1px solid var(--line);border-radius:20px;padding:18px;box-shadow:0 20px 60px rgba(45,60,52,.1)}label{display:block;margin:0 0 7px;color:var(--muted);font-size:12px;font-weight:800;letter-spacing:.12em}select{width:100%;padding:14px;border:1px solid var(--line);border-radius:13px;background:#fff;font-size:17px;color:var(--ink);margin-bottom:16px}.btn{width:100%;border:0;border-radius:13px;padding:15px;background:var(--jade);color:#fff;font-size:18px;font-weight:800;cursor:pointer}.btn:active{background:var(--jade-dark)}.hud{display:none;grid-template-columns:1fr auto auto;gap:8px;align-items:center;margin-bottom:12px}.bar{height:8px;background:#dce7e1;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:var(--jade);width:0}.stat{background:#fff;border:1px solid var(--line);padding:8px 10px;border-radius:10px;font-size:13px}.game{display:none;text-align:center;min-height:540px;align-items:center;justify-content:center;flex-direction:column}.mode{color:#9a7438;font-size:12px;font-weight:900;letter-spacing:.13em;text-transform:uppercase}.instruction{color:var(--muted);margin:8px 0 20px}.hanzi{font:600 66px/1.2 var(--hanzi);margin:8px 0 26px}.visual{width:min(330px,84vw);height:220px;border-radius:24px;border:1px solid var(--line);background:#fff;display:grid;place-items:center;font-size:105px;margin-bottom:24px}.audio{width:112px;height:112px;border:0;border-radius:50%;background:var(--jade);color:#fff;font-size:42px;margin-bottom:24px}.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%}.opt{border:1px solid var(--line);background:#fff;border-radius:15px;padding:15px;min-height:70px;font:600 27px/1.25 var(--hanzi);color:var(--ink)}.opt.good{background:var(--good)}.opt.bad{background:var(--bad)}.feedback{display:none;text-align:left;width:100%;margin-top:16px;padding:16px;border-radius:15px}.feedback.good{display:block;background:var(--good)}.feedback.bad{display:block;background:var(--bad)}.fbh{font:600 38px/1.2 var(--hanzi)}.py{color:var(--jade);font-weight:700}.es{color:var(--muted);margin-top:4px}.next{margin-top:14px}.question{font:600 31px/1.5 var(--hanzi);text-align:left;width:100%;background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:18px}.finish{display:none;text-align:center}.score{font-size:68px;font-weight:900;color:var(--jade)}@media(max-width:600px){.opts{grid-template-columns:1fr}.game{min-height:500px}.hanzi{font-size:54px}}</style></head><body><main class="app"><div class="top"><div class="brand"><div class="logo">明</div><div><h1>Míng · Reto Mixto</h1><div class="sub">Vista web móvil · prototipo</div></div></div></div><section id="setup" class="panel"><label>CONTENIDO</label><select id="lesson"><option value="1">Lección 1 · 你最近怎么样？</option><option value="2">Lección 2 · 你是哪国人？</option><option value="3" selected>Lección 3 · 你们家有几口人？</option><option value="123">Acumulado · L1 + L2 + L3</option></select><label>RONDAS</label><select id="rounds"><option>10</option><option selected>20</option><option>30</option></select><button class="btn" id="start">Comenzar</button><p class="sub" style="text-align:center;margin:14px 0 0">Sin pinyin ni español durante la pregunta. Si fallas, aparece la corrección completa.</p></section><div id="hud" class="hud"><div class="bar"><i id="bar"></i></div><div class="stat">✅ <b id="ok">0</b></div><div class="stat">❌ <b id="bad">0</b></div></div><section id="game" class="panel game"></section><section id="finish" class="panel finish"></section></main><script>const V=[{l:1,h:'好',p:'hǎo',e:'bien; bueno',v:'👍'},{l:1,h:'忙',p:'máng',e:'ocupado',v:'💼'},{l:1,h:'谢谢',p:'xièxie',e:'gracias',v:'🙏'},{l:1,h:'高兴',p:'gāoxìng',e:'contento; feliz',v:'😄'},{l:2,h:'老师',p:'lǎoshī',e:'profesor/a',v:'🧑‍🏫'},{l:2,h:'朋友',p:'péngyou',e:'amigo/a',v:'🧑‍🤝‍🧑'},{l:2,h:'米饭',p:'mǐfàn',e:'arroz cocido',v:'🍚'},{l:2,h:'面条儿',p:'miàntiáor',e:'tallarines',v:'🍜'},{l:2,h:'饺子',p:'jiǎozi',e:'ravioles chinos',v:'🥟'},{l:2,h:'包子',p:'bāozi',e:'bollo al vapor',v:'🥠'},{l:3,h:'家',p:'jiā',e:'familia; casa',v:'🏠'},{l:3,h:'照片',p:'zhàopiàn',e:'foto',v:'🖼️'},{l:3,h:'医生',p:'yīshēng',e:'doctor/a',v:'🧑‍⚕️'},{l:3,h:'弟弟',p:'dìdi',e:'hermano menor',v:'👦'},{l:3,h:'哥哥',p:'gēge',e:'hermano mayor',v:'🧔‍♂️'},{l:3,h:'姐姐',p:'jiějie',e:'hermana mayor',v:'👩'},{l:3,h:'妹妹',p:'mèimei',e:'hermana menor',v:'👧'},{l:3,h:'狗',p:'gǒu',e:'perro',v:'🐶'},{l:3,h:'茶',p:'chá',e:'té',v:'🍵'},{l:3,h:'咖啡',p:'kāfēi',e:'café',v:'☕'},{l:3,h:'钢琴',p:'gāngqín',e:'piano',v:'🎹'}];const Q=[{l:1,q:'你最近怎么样？',a:'我很好。你呢？'},{l:1,q:'你忙吗？',a:'我不太忙。'},{l:2,q:'你是哪国人？',a:'我是美国人。'},{l:2,q:'这是什么？',a:'这是点心。'},{l:2,q:'这是饺子吗？',a:'这不是饺子，是包子。'},{l:3,q:'你们家有几口人？',a:'我们家有四口人。'},{l:3,q:'你爸爸妈妈做什么工作？',a:'我爸爸是医生，妈妈是老师。'},{l:3,q:'你们喝什么？',a:'我喝咖啡。'},{l:3,q:'你女儿今年几岁？',a:'五岁。'}];const $=s=>document.querySelector(s),sh=a=>[...a].sort(()=>Math.random()-.5),pick=a=>a[Math.floor(Math.random()*a.length)];let S;function lessons(){return $('#lesson').value==='123'?[1,2,3]:[+$('#lesson').value]}function vp(){return V.filter(x=>S.ls.includes(x.l))}function qp(){return Q.filter(x=>S.ls.includes(x.l))}function hud(){ $('#ok').textContent=S.ok;$('#bad').textContent=S.bad;$('#bar').style.width=(100*S.i/S.n)+'%'}function speech(t){if(!('speechSynthesis'in window)){alert('Audio no disponible en este navegador');return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='zh-CN';u.rate=.78;speechSynthesis.speak(u)}function start(){S={ls:lessons(),n:+$('#rounds').value,i:0,ok:0,bad:0};$('#setup').style.display='none';$('#hud').style.display='grid';$('#game').style.display='flex';next()}function next(){if(S.i>=S.n)return done();hud();let m=pick(['image','hanzi','audio','dialogue']);m==='dialogue'&&qp().length<4?m='image':0;render(m)}function options(target,pool){return sh([target,...sh(pool.filter(x=>x!==target)).slice(0,3)])}function render(m){let g=$('#game');g.innerHTML='';if(m==='dialogue'){let q=pick(qp()),os=options(q,qp());g.innerHTML='<div class="mode">Conversación</div><p class="instruction">Escoge la respuesta correcta.</p><div class="question">'+q.q+'</div><div class="opts">'+os.map((x,i)=>'<button class="opt" data-a="'+(x===q?1:0)+'">'+x.a+'</button>').join('')+'</div><div id="fb" class="feedback"></div>';g.querySelectorAll('.opt').forEach(b=>b.onclick=()=>answer(b.dataset.a==='1',q.a,'',''));return}let t=pick(vp()),os=options(t,vp());if(m==='image')g.innerHTML='<div class="mode">Imagen → Hanzi</div><p class="instruction">Elige el Hanzi correcto.</p><div class="visual">'+t.v+'</div><div class="opts">'+os.map(x=>'<button class="opt" data-h="'+x.h+'">'+x.h+'</button>').join('')+'</div><div id="fb" class="feedback"></div>';if(m==='hanzi')g.innerHTML='<div class="mode">Hanzi → imagen</div><p class="instruction">Elige la imagen correcta.</p><div class="hanzi">'+t.h+'</div><div class="opts">'+os.map(x=>'<button class="opt" data-h="'+x.h+'" style="font-size:55px">'+x.v+'</button>').join('')+'</div><div id="fb" class="feedback"></div>';if(m==='audio')g.innerHTML='<div class="mode">Audio → Hanzi</div><p class="instruction">Escucha y elige.</p><button id="audio" class="audio">🔊</button><div class="opts">'+os.map(x=>'<button class="opt" data-h="'+x.h+'">'+x.h+'</button>').join('')+'</div><div id="fb" class="feedback"></div>';if(m==='audio')$('#audio').onclick=()=>speech(t.h);g.querySelectorAll('.opt').forEach(b=>b.onclick=()=>answer(b.dataset.h===t.h,t.h,t.p,t.e))}function answer(ok,h,p,e){g=$('#game');g.querySelectorAll('.opt').forEach(x=>x.disabled=true);ok?S.ok++:S.bad++;hud();let f=$('#fb');f.className='feedback '+(ok?'good':'bad');f.innerHTML=ok?'<b>✓ Correcto</b>':'<b>✕ Incorrecto</b><div class="fbh">'+h+'</div><div class="py">'+p+'</div><div class="es">'+e+'</div><button class="btn next" id="go">Continuar →</button>';if(ok)setTimeout(()=>{S.i++;next()},550);else $('#go').onclick=()=>{S.i++;next()}}function done(){$('#game').style.display='none';$('#hud').style.display='none';let f=$('#finish');f.style.display='block';let pct=Math.round(100*S.ok/Math.max(1,S.ok+S.bad));f.innerHTML='<div class="score">'+pct+'%</div><h2>'+S.ok+' correctas · '+S.bad+' incorrectas</h2><button id="again" class="btn">Otra sesión</button>';$('#again').onclick=()=>location.reload()}$('#start').onclick=start;</script></body></html>
