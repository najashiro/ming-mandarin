name: Prepare reviewed corpus transfer
on:
  push:
    branches: ['corpus/v2.2.0-close-lesson4-20260929']
permissions:
  contents: read
jobs:
  prepare-reviewed-tree:
    if: github.repository == 'najashiro/ming-mandarin'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Verify transfer, run closure tests, prepare unreferenced Git tree
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 MING_KNOWLEDGE/.delivery/prepare.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: corpus-reviewed-transfer-${{ github.sha }}
          path: closure-artifact/
          retention-days: 7
