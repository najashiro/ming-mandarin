name: Prepare regenerated historical audit reports
on:
  push:
    branches: ['corpus/v2.2.0-close-lesson4-20260929']
permissions:
  contents: read
jobs:
  prepare-reports:
    if: github.repository == 'najashiro/ming-mandarin' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Reproduce checksum-reviewed reports and prepare an unreferenced tree
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, difflib, hashlib, json, os, subprocess, urllib.request
          from pathlib import Path
          def run(*args):
              return subprocess.check_output(args, text=True).strip()
          assert run('git', 'rev-parse', 'HEAD^') == '7411999c0f12ce4e067867320f1cddd47844a3d4', 'Unexpected parent'
          head = run('git', 'rev-parse', 'HEAD')
          assert head == os.environ['GITHUB_SHA']
          root = Path('MING_KNOWLEDGE/v2')
          generators = {
              'translations_ming.py': '89a0a711db15b8f8df17afc29cca62e0de9d8c00d073b59b6acc53bc184b59d9',
              'pinyin_ming.py': '2af3e8b5201685dffa6020ffd3bf8c7ab73f89db0398c26c91b6db08e1ae56d6',
              'visual_ming.py': 'bacb09143640ef7dfc2bb3ac42c78edce292b53726e9f3ab3b0c33a02882e218',
          }
          expected = {
              'translations-ming-20260925.json': ['4d4af5d4aad5ec2bd58e7045d743ce118f9fce84e9d6f22d055e0efa39e8936f', '322ddba7a31943b590d4d1a921688fa45c7cfe288f561069435879ecf6a77403'],
              'translations-ming-20260925.md': ['7692645bd2400c6f47443d48fbece4b1a69605dfd7bd5c70e2a0e9d8f4c4c956', '86c1630c318beafa41cc6cd9dd428fc8f40bce5e9da1b292a592664093d6cf7a'],
              'pinyin-ming-20260925.json': ['c0f5ebc0af7a6b44f606e41a0dace07cc8dbc055698db40c0202fb758b584c0d', '764903f3493e9e4b8961a3d2afdd41091bb7e01589cf90d30ff68ca4984cfa2e'],
              'pinyin-ming-20260925.md': ['f8b7fd14711b327c002ddc5b3c87304a655073e4ddc4f7313e8b6fb994c452e7', 'ce3f4a2ec1a55fc6a56c3072ea34870480aab91c28d01bbc7685b799e276eb71'],
              'visual-ming-20260925.json': ['51fe182c4fb811c854d60e8cb40ef1d4617c539867ff91cd6588cd3b0cf869da', '1afa233b45bb7e8f59a5988730ac013988a11e750e10963bdf69846bd37bb98b'],
              'visual-ming-20260925.md': ['95407edea3387d39d240e85ee5267704aac20a61f2dba4421680fcf3b7652930', '95407edea3387d39d240e85ee5267704aac20a61f2dba4421680fcf3b7652930'],
          }
          files = {name: root/'audits'/name for name in expected}
          before = {name: p.read_bytes() for name, p in files.items()}
          for name, data in before.items():
              assert hashlib.sha256(data).hexdigest() == expected[name][0], 'Report base changed: ' + name
          assert hashlib.sha256((root/'query_v21.py').read_bytes()).hexdigest() == 'd837666693755baf6068a03aae2ef2d9a200e4e0e8e4b6d5a34a4785c7ec347b'
          public_before = Path('data/corpus-v21-public.json').read_bytes()
          for module, digest in generators.items():
              assert hashlib.sha256((root/module).read_bytes()).hexdigest() == digest, 'Generator changed'
              subprocess.run(['python3', str(root/module), '--check', '--write-reports'], check=True, stdout=subprocess.DEVNULL)
          assert Path('data/corpus-v21-public.json').read_bytes() == public_before, 'Learner data changed'
          changed = {}
          for name, p in files.items():
              raw = p.read_bytes()
              assert hashlib.sha256(raw).hexdigest() == expected[name][1], 'Output differs from locally reviewed result: ' + name
              if raw != before[name]:
                  changed[str(p)] = {'sha256': expected[name][1]}
          assert set(run('git', 'diff', '--name-only').splitlines()) == set(changed) and len(changed) == 5
          subprocess.run(['python3', str(root/'visual_ming.py'), '--check', '--check-reports'], check=True, stdout=subprocess.DEVNULL)
          subprocess.run(['python3', 'scripts/export-corpus-v21.py', '--check'], check=True)
          subprocess.run(['python3', 'scripts/export-corpus-v22.py', '--check'], check=True)
          api = 'https://api.github.com/repos/najashiro/ming-mandarin/'
          def post(path, payload):
              req = urllib.request.Request(api + path, data=json.dumps(payload).encode(), method='POST', headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json', 'X-GitHub-Api-Version': '2022-11-28'})
              with urllib.request.urlopen(req, timeout=30) as response:
                  return json.load(response)
          entries = []
          for name in sorted(changed):
              raw = Path(name).read_bytes()
              blob = post('git/blobs', {'content': base64.b64encode(raw).decode(), 'encoding': 'base64'})
              assert blob['sha'] == hashlib.sha1(b'blob ' + str(len(raw)).encode() + b'\0' + raw).hexdigest()
              entries.append({'path': name, 'mode': '100644', 'type': 'blob', 'sha': blob['sha']})
              changed[name]['git_blob_sha'] = blob['sha']
          entries.append({'path': '.github/workflows/corpus-refresh-reports-once.yml', 'mode': '100644', 'type': 'blob', 'sha': None})
          tree = post('git/trees', {'base_tree': run('git', 'rev-parse', 'HEAD^{tree}'), 'tree': entries})
          result = {'parent_commit': head, 'tree_sha': tree['sha'], 'changes': changed, 'source_and_public_data_unchanged': True, 'outputs_match_local_review': True, 'projections_validated': ['v2.1', 'v2.2'], 'branch_updated': False}
          out = Path('report-evidence'); out.mkdir()
          (out/'prepared-tree.json').write_text(json.dumps(result, indent=2) + '\n')
          for name in changed:
              p = Path(name)
              (out/p.name).write_bytes(p.read_bytes())
              diff = ''.join(difflib.unified_diff(before[p.name].decode().splitlines(True), p.read_text().splitlines(True), fromfile=p.name+' old', tofile=p.name+' regenerated'))
              (out/(p.name+'.diff')).write_text(diff)
          print(json.dumps(result, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: corpus-regenerated-reports-${{ github.sha }}
          path: report-evidence/
          retention-days: 7
          if-no-files-found: error
