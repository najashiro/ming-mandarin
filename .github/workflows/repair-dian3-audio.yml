name: Repair only dian3 audio

on:
  push:
    branches: [fix/dian3-audio-20260920]
    paths: [.github/workflows/repair-dian3-audio.yml]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repair-dian3-audio
  cancel-in-progress: false

jobs:
  repair:
    if: github.repository == 'najashiro/ming-mandarin' && github.ref == 'refs/heads/fix/dian3-audio-20260920'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check OpenAI secret without displaying it
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo '::error::Missing repository Actions secret OPENAI_API_KEY. No audio has been generated or replaced. Add it in Settings > Secrets and variables > Actions, then re-run this job.'
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: fix/dian3-audio-20260920
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Ensure audio decoder is available
        run: |
          if ! command -v ffprobe >/dev/null || ! command -v ffmpeg >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y ffmpeg
          fi

      - name: Prepare exactly one clip and retain the previous audio
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { readFileSync, writeFileSync, copyFileSync } from 'node:fs';
          import path from 'node:path';
          const file = 'data/mandarin-audio.json';
          const original = readFileSync(file, 'utf8');
          const manifest = JSON.parse(original);
          const matches = manifest.clips.filter(c => c.id === 'l2-h-1d59ea7cbb');
          assert.equal(matches.length, 1, 'Expected exactly one target clip');
          const clip = matches[0];
          assert.equal(clip.input, '点');
          assert.equal(clip.expectedPinyin.normalize('NFC'), 'diǎn');
          assert.match(clip.file, /^l2-h-1d59ea7cbb(?:-[a-z0-9-]+)?\.mp3$/);
          writeFileSync(path.join(process.env.RUNNER_TEMP, 'dian3-manifest-before.json'), original);
          copyFileSync(path.join('public/audio/mandarin', clip.file), path.join(process.env.RUNNER_TEMP, 'dian3-previous.mp3'));
          clip.file = 'l2-h-1d59ea7cbb-dian3-candidate.mp3';
          clip.instructions = '请只朗读输入的汉字点一次。读音是diǎn，第三声。使用清晰自然的标准普通话教学发音，单字读完整第三声。保留韵尾n，不卷舌，不儿化，不读成点儿，不添加任何其他音节、数字、拼音字母或解释。';
          writeFileSync(file, JSON.stringify(manifest, null, 2) + '\n');
          JS
          node scripts/generate-pronunciation-audio.mjs --only=l2-h-1d59ea7cbb --dry-run

      - name: Generate only dian3 with the existing TTS model and configured voice
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_TTS_VOICE: ${{ vars.OPENAI_TTS_VOICE || 'marin' }}
        run: node scripts/generate-pronunciation-audio.mjs --only=l2-h-1d59ea7cbb --force

      - name: Decode the candidate and check its duration
        run: |
          candidate=public/audio/mandarin/l2-h-1d59ea7cbb-dian3-candidate.mp3
          ffmpeg -v error -i "$candidate" -f null -
          ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 "$candidate" > "$RUNNER_TEMP/dian3-duration.txt"

      - name: Verify scope and create a cache-safe audio filename
        id: verify
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { createHash } from 'node:crypto';
          import { readFileSync, writeFileSync, renameSync, appendFileSync } from 'node:fs';
          import path from 'node:path';
          const manifestPath = 'data/mandarin-audio.json';
          const before = JSON.parse(readFileSync(path.join(process.env.RUNNER_TEMP, 'dian3-manifest-before.json'), 'utf8'));
          const manifest = JSON.parse(readFileSync(manifestPath, 'utf8'));
          const id = 'l2-h-1d59ea7cbb';
          assert.deepEqual(manifest.clips.filter(c => c.id !== id), before.clips.filter(c => c.id !== id), 'Other clips must remain unchanged');
          const clip = manifest.clips.find(c => c.id === id);
          const original = before.clips.find(c => c.id === id);
          const { file: f1, instructions: i1, ...rest1 } = clip;
          const { file: f2, instructions: i2, ...rest2 } = original;
          assert.deepEqual(rest1, rest2, 'Hanzi, pinyin and identity must not change');
          const candidate = path.join('public/audio/mandarin', clip.file);
          const bytes = readFileSync(candidate);
          const previous = readFileSync(path.join(process.env.RUNNER_TEMP, 'dian3-previous.mp3'));
          assert(bytes.length > 512 && bytes.length < 1000000, 'Unexpected MP3 size');
          const duration = Number(readFileSync(path.join(process.env.RUNNER_TEMP, 'dian3-duration.txt'), 'utf8').trim());
          assert(Number.isFinite(duration) && duration >= 0.15 && duration <= 5, 'Unexpected duration for a single syllable');
          const digest = createHash('sha256').update(bytes).digest('hex');
          assert.notEqual(digest, createHash('sha256').update(previous).digest('hex'), 'Audio bytes did not change');
          clip.file = `l2-h-1d59ea7cbb-dian3-${digest.slice(0, 12)}.mp3`;
          const destination = path.join('public/audio/mandarin', clip.file);
          renameSync(candidate, destination);
          // Replace the legacy URL too, while the manifest uses a fresh cache-safe URL.
          writeFileSync('public/audio/mandarin/l2-h-1d59ea7cbb.mp3', bytes);
          writeFileSync(manifestPath, JSON.stringify(manifest, null, 2) + '\n');
          appendFileSync(process.env.GITHUB_OUTPUT, `audio=${destination}\n`);
          appendFileSync(process.env.GITHUB_STEP_SUMMARY, `## 点 — diǎn\nGenerated one AI-voice clip.\n\n- Duration: ${duration}s\n- SHA-256: ${digest}\n- New file: ${destination}\n- Other clips unchanged.\n\nDecoder and scope checks are not a phonetic audit. Listen to verify third tone, final -n and no erhua before merging. Main has not been changed by this workflow.\n`);
          JS
          git diff --check

      - name: Save both versions for listening
        uses: actions/upload-artifact@v4
        with:
          name: dian3-audio-comparison
          path: |
            ${{ steps.verify.outputs.audio }}
            ${{ runner.temp }}/dian3-previous.mp3
          if-no-files-found: error
          retention-days: 7

      - name: Commit the replacement only to the repair branch
        env:
          AUDIO_FILE: ${{ steps.verify.outputs.audio }}
        run: |
          git add -- data/mandarin-audio.json public/audio/mandarin/l2-h-1d59ea7cbb.mp3 "$AUDIO_FILE"
          python3 - <<'PY'
          import os, subprocess
          actual = set(subprocess.check_output(['git', 'diff', '--cached', '--name-only'], text=True).splitlines())
          expected = {'data/mandarin-audio.json', 'public/audio/mandarin/l2-h-1d59ea7cbb.mp3', os.environ['AUDIO_FILE']}
          if actual != expected:
              raise SystemExit('Refusing to commit unexpected files: ' + repr(actual))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(audio): regenerate 点 diǎn without erhua'
          git push origin HEAD:refs/heads/fix/dian3-audio-20260920
